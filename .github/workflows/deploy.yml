name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://fuckyoustan.github.io
      ASTRO_BASE: /Stan-Ganteng
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Tries to enable Pages (needs the repo setting or a PAT with Pages
      # permission). If it cannot, the step warns and deploy is skipped —
      # the workflow goes green again and deploys automatically once
      # Settings -> Pages -> Source: GitHub Actions has been enabled.
      - name: Enable Pages if not yet enabled
        id: enable
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.enable.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Skipped (Pages not enabled yet)
        if: steps.enable.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages is not enabled on this repo yet. Enable it once via Settings -> Pages -> Source: GitHub Actions, and the next push will deploy to https://fuckyoustan.github.io/Stan-Ganteng automatically. Main site: https://fuckyoustan.vercel.app"
